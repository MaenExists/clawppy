name = "clawppy"
compatibility_date = "2024-12-18"
main = "src/index.ts"

[observability]
enabled = true

[[kv_namespaces]]
binding = "CLAWPPY_KV"
id = "YOUR_KV_NAMESPACE_ID_HERE"

[env.production]
vars = { ENVIRONMENT = "production" }

# Note: Set OPENCODE_API_KEY in Cloudflare Dashboard or via CLI
# wrangler secret put OPENCODE_API_KEY