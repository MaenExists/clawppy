name = "clawppy"
compatibility_date = "2024-12-18"
main = "src/index.ts"

[observability]
enabled = true

# REPLACE THE ID BELOW WITH YOUR KV NAMESPACE ID FROM CLOUDFLARE DASHBOARD
[[kv_namespaces]]
binding = "CLAWPPY_KV"
id = "YOUR_KV_NAMESPACE_ID_HERE"

[env.production]
vars = { ENVIRONMENT = "production" }

# Secrets - set via CLI (DO NOT commit to repo):
# wrangler secret put OPENCODE_API_KEY
# (API key stored in .env file for local dev only)